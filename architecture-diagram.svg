<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#556" />
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#0f1117"/>

  <text x="30" y="40" fill="#e8e8ec" font-size="22" font-weight="700">AI-Driven Infrastructure Architecture</text>
  <text x="30" y="62" fill="#9aa0ac" font-size="13">Self-hosted Proxmox cluster · pfSense perimeter · containerized AI/automation stack (values anonymized)</text>

  <!-- Internet -->
  <rect x="30" y="90" width="200" height="50" rx="8" fill="#1c2030" stroke="#3a4160"/>
  <text x="130" y="120" fill="#c7cbe0" font-size="13" text-anchor="middle">Internet / Clients</text>

  <!-- Remote Admin -->
  <rect x="970" y="90" width="200" height="50" rx="8" fill="#1c2030" stroke="#3a4160"/>
  <text x="1070" y="112" fill="#c7cbe0" font-size="13" text-anchor="middle">Remote Admin</text>
  <text x="1070" y="128" fill="#8a90a0" font-size="10" text-anchor="middle">(VPN-only access)</text>

  <!-- Firewall / Proxmox host -->
  <rect x="30" y="180" width="1140" height="70" rx="8" fill="#161a26" stroke="#4a5580" stroke-width="1.5"/>
  <text x="50" y="205" fill="#e8e8ec" font-size="14" font-weight="600">Proxmox Hypervisor (Public Cloud)</text>
  <text x="50" y="224" fill="#8a90a0" font-size="11">pfSense Firewall VM — WAN filtering · NAT · WireGuard VPN endpoint · non-default admin port</text>

  <!-- Arrow internet -> firewall -->
  <line x1="130" y1="140" x2="130" y2="180" stroke="#556" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1070" y1="140" x2="1070" y2="180" stroke="#556" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="1080" y="165" fill="#7a80a0" font-size="10">VPN tunnel</text>

  <!-- LAN label -->
  <text x="50" y="278" fill="#9aa0ac" font-size="12" font-weight="600">Internal LAN — isolated subnet</text>
  <line x1="30" y1="288" x2="1170" y2="288" stroke="#2a2f42" stroke-width="1"/>

  <!-- Row of VMs -->
  <!-- Monitoring -->
  <rect x="30" y="310" width="210" height="110" rx="8" fill="#181c28" stroke="#3a4160"/>
  <text x="135" y="332" fill="#e8e8ec" font-size="13" font-weight="700" text-anchor="middle">Monitoring VM</text>
  <text x="135" y="352" fill="#9aa0ac" font-size="10" text-anchor="middle">CheckMK dashboard</text>
  <text x="135" y="368" fill="#9aa0ac" font-size="10" text-anchor="middle">Agent-based host monitoring</text>
  <text x="135" y="384" fill="#9aa0ac" font-size="10" text-anchor="middle">Email + dashboard alerting</text>
  <text x="135" y="404" fill="#6f7488" font-size="9" text-anchor="middle">SSH hardened, key-only</text>

  <!-- Analytics -->
  <rect x="260" y="310" width="210" height="110" rx="8" fill="#181c28" stroke="#3a4160"/>
  <text x="365" y="332" fill="#e8e8ec" font-size="13" font-weight="700" text-anchor="middle">Analytics VM</text>
  <text x="365" y="352" fill="#9aa0ac" font-size="10" text-anchor="middle">Web analytics platform</text>
  <text x="365" y="368" fill="#9aa0ac" font-size="10" text-anchor="middle">Internal MySQL store</text>
  <text x="365" y="384" fill="#9aa0ac" font-size="10" text-anchor="middle">Reverse-proxied, HTTPS-only</text>
  <text x="365" y="404" fill="#6f7488" font-size="9" text-anchor="middle">TLS auto-renewed</text>

  <!-- Render pipeline -->
  <rect x="490" y="310" width="230" height="110" rx="8" fill="#181c28" stroke="#3a4160"/>
  <text x="605" y="332" fill="#e8e8ec" font-size="13" font-weight="700" text-anchor="middle">Render/Media VM</text>
  <text x="605" y="352" fill="#9aa0ac" font-size="10" text-anchor="middle">FFmpeg + Blender pipeline</text>
  <text x="605" y="368" fill="#9aa0ac" font-size="10" text-anchor="middle">Job API · drop-folder intake</text>
  <text x="605" y="384" fill="#9aa0ac" font-size="10" text-anchor="middle">Triggered by AI agent, not raw webhook</text>
  <text x="605" y="404" fill="#6f7488" font-size="9" text-anchor="middle">fail2ban on SSH ingress</text>

  <!-- AI Agent Gateway -->
  <rect x="740" y="310" width="210" height="110" rx="8" fill="#181c28" stroke="#3a4160" stroke-dasharray="5,4"/>
  <text x="845" y="332" fill="#e8e8ec" font-size="13" font-weight="700" text-anchor="middle">AI Agent Gateway</text>
  <text x="845" y="352" fill="#9aa0ac" font-size="10" text-anchor="middle">Chat-driven automation</text>
  <text x="845" y="368" fill="#9aa0ac" font-size="10" text-anchor="middle">Confirm-before-execute guardrail</text>
  <text x="845" y="384" fill="#9aa0ac" font-size="10" text-anchor="middle">40+ blocked action-patterns</text>
  <text x="845" y="404" fill="#6f7488" font-size="9" text-anchor="middle">status: planned</text>

  <!-- AI Core -->
  <rect x="970" y="310" width="200" height="110" rx="8" fill="#181c28" stroke="#3a4160"/>
  <text x="1070" y="332" fill="#e8e8ec" font-size="13" font-weight="700" text-anchor="middle">AI Core VM</text>
  <text x="1070" y="352" fill="#9aa0ac" font-size="10" text-anchor="middle">12-container Docker stack</text>
  <text x="1070" y="368" fill="#9aa0ac" font-size="10" text-anchor="middle">LLM engine + RAG service</text>
  <text x="1070" y="384" fill="#9aa0ac" font-size="10" text-anchor="middle">Reverse proxy, TLS-terminated</text>
  <text x="1070" y="404" fill="#6f7488" font-size="9" text-anchor="middle">nightly encrypted backups</text>

  <!-- connectors firewall -> VMs -->
  <line x1="135" y1="250" x2="135" y2="310" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="365" y1="250" x2="365" y2="310" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="605" y1="250" x2="605" y2="310" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="845" y1="250" x2="845" y2="310" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <line x1="1070" y1="250" x2="1070" y2="310" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- AI core expanded -->
  <rect x="30" y="460" width="1140" height="180" rx="8" fill="#12141d" stroke="#2e3448"/>
  <text x="50" y="484" fill="#e8e8ec" font-size="13" font-weight="700">AI Core — Docker Stack (12 containers)</text>

  <g font-size="10" fill="#a9aec2">
    <rect x="50" y="500" width="150" height="36" rx="6" fill="#1c2030" stroke="#3a4160"/>
    <text x="125" y="522" text-anchor="middle">Reverse Proxy / TLS</text>

    <rect x="215" y="500" width="150" height="36" rx="6" fill="#1c2030" stroke="#3a4160"/>
    <text x="290" y="522" text-anchor="middle">Chatbot Platform</text>

    <rect x="380" y="500" width="150" height="36" rx="6" fill="#1c2030" stroke="#3a4160"/>
    <text x="455" y="522" text-anchor="middle">Agent Studio</text>

    <rect x="545" y="500" width="150" height="36" rx="6" fill="#1c2030" stroke="#3a4160"/>
    <text x="620" y="522" text-anchor="middle">LLM Engine</text>

    <rect x="710" y="500" width="150" height="36" rx="6" fill="#1c2030" stroke="#3a4160"/>
    <text x="785" y="522" text-anchor="middle">RAG / Knowledge</text>

    <rect x="875" y="500" width="150" height="36" rx="6" fill="#1c2030" stroke="#3a4160"/>
    <text x="950" y="522" text-anchor="middle">Admin Portal</text>

    <rect x="50" y="550" width="150" height="36" rx="6" fill="#1c2030" stroke="#3a4160"/>
    <text x="125" y="572" text-anchor="middle">PDF Report Gen</text>

    <rect x="215" y="550" width="150" height="36" rx="6" fill="#1c2030" stroke="#3a4160"/>
    <text x="290" y="572" text-anchor="middle">Enquiry Intake Agent</text>

    <rect x="380" y="550" width="150" height="36" rx="6" fill="#1c2030" stroke="#3a4160"/>
    <text x="455" y="572" text-anchor="middle">Email Handler Agent</text>

    <rect x="545" y="550" width="150" height="36" rx="6" fill="#1c2030" stroke="#3a4160"/>
    <text x="620" y="572" text-anchor="middle">Analytics Bridge</text>

    <rect x="710" y="550" width="150" height="36" rx="6" fill="#1c2030" stroke="#3a4160"/>
    <text x="785" y="572" text-anchor="middle">DB — Chatbot</text>

    <rect x="875" y="550" width="150" height="36" rx="6" fill="#1c2030" stroke="#3a4160"/>
    <text x="950" y="572" text-anchor="middle">DB — Agent Studio</text>
  </g>

  <text x="50" y="618" fill="#6f7488" font-size="10">Nightly Postgres dump → 30-day retention · certs auto-renewed &amp; redeployed via deploy hook</text>

  <!-- Flow strip -->
  <text x="30" y="670" fill="#9aa0ac" font-size="12" font-weight="600">Representative flow — client enquiry to lead capture</text>
  <g font-size="10" fill="#c7cbe0">
    <rect x="30" y="685" width="170" height="40" rx="6" fill="#161a26" stroke="#3a4160"/>
    <text x="115" y="709" text-anchor="middle">Website chat widget</text>
    <line x1="200" y1="705" x2="235" y2="705" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="240" y="685" width="170" height="40" rx="6" fill="#161a26" stroke="#3a4160"/>
    <text x="325" y="709" text-anchor="middle">Intake AI agent</text>
    <line x1="410" y1="705" x2="445" y2="705" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="450" y="685" width="170" height="40" rx="6" fill="#161a26" stroke="#3a4160"/>
    <text x="535" y="709" text-anchor="middle">Local LLM classifies</text>
    <line x1="620" y1="705" x2="655" y2="705" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="660" y="685" width="170" height="40" rx="6" fill="#161a26" stroke="#3a4160"/>
    <text x="745" y="709" text-anchor="middle">Lead stored (DB)</text>
    <line x1="830" y1="705" x2="865" y2="705" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="870" y="685" width="170" height="40" rx="6" fill="#161a26" stroke="#3a4160"/>
    <text x="955" y="709" text-anchor="middle">Email alert to owner</text>
  </g>

  <text x="30" y="770" fill="#9aa0ac" font-size="12" font-weight="600">Representative flow — automation with human-in-the-loop</text>
  <g font-size="10" fill="#c7cbe0">
    <rect x="30" y="785" width="170" height="40" rx="6" fill="#161a26" stroke="#3a4160"/>
    <text x="115" y="809" text-anchor="middle">Chat command (admin)</text>
    <line x1="200" y1="805" x2="235" y2="805" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="240" y="785" width="170" height="40" rx="6" fill="#161a26" stroke="#3a4160"/>
    <text x="325" y="809" text-anchor="middle">Agent plans action</text>
    <line x1="410" y1="805" x2="445" y2="805" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="450" y="785" width="170" height="40" rx="6" fill="#161a26" stroke="#3a4160" stroke-dasharray="5,4"/>
    <text x="535" y="809" text-anchor="middle">Human confirms?</text>
    <line x1="620" y1="805" x2="655" y2="805" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="660" y="785" width="170" height="40" rx="6" fill="#161a26" stroke="#3a4160"/>
    <text x="745" y="809" text-anchor="middle">Action executes</text>
    <line x1="830" y1="805" x2="865" y2="805" stroke="#556" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

    <rect x="870" y="785" width="170" height="40" rx="6" fill="#161a26" stroke="#3a4160"/>
    <text x="955" y="809" text-anchor="middle">Result logged</text>
  </g>

  <text x="30" y="860" fill="#565b70" font-size="10">All IPs, ports, domains, and credentials are illustrative — sanitized from a production deployment.</text>
</svg>
